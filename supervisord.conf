; =============================================================================
; Supervisor Configuration for DOWNVID
; Runs both FastAPI backend and Next.js frontend in production
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; FastAPI Backend - runs on port 8080 (Fly.io PORT)
[program:backend]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

; Next.js Frontend - runs on port 3000 (internal only, proxied via backend)
[program:frontend]
command=npm run start
directory=/app/frontend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="3000"
