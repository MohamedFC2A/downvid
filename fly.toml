# fly.toml - Fly.io configuration for DOWNVID
# See https://fly.io/docs/reference/configuration/

app = 'downvid'
primary_region = 'cdg'

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  PYTHONUNBUFFERED = "1"
  # Backend URL for Next.js rewrites (internal)
  BACKEND_URL = "http://127.0.0.1:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# WebSocket support
[http_service.concurrency]
  type = "connections"
  hard_limit = 250
  soft_limit = 200

[[vm]]
  memory = '512mb'
  cpus = 1
